name: Deploy to GitHub Pages

# Builds the site and publishes dist/ to the gh-pages branch, which GitHub Pages serves at
# https://abubakrmmarufov-tech.github.io/ismoili_somoni/

on:
  push:
    branches: [ "claude/somoni-monument-3d-4xihh7", "main" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Publish dist/ to gh-pages
        working-directory: dist
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
      - name: Request a Pages build and report the site status
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          auth=(-H "Authorization: Bearer ${TOKEN}" -H "Accept: application/vnd.github+json")
          echo "--- pages config"; curl -s "${auth[@]}" "$api"
          echo "--- request build"; curl -s -X POST "${auth[@]}" "$api/builds"
          sleep 20
          echo "--- latest build"; curl -s "${auth[@]}" "$api/builds/latest"
